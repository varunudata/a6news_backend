
name: Deploy A6News Backend

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a6news-backend-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy backend
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "$EC2_USER@$EC2_HOST" \
            'export PATH=/home/ubuntu/.nvm/versions/node/v22.23.4/bin:$PATH &&
             cd ~/A6News/server &&
             OLD_COMMIT=$(git rev-parse HEAD) &&
             git pull --ff-only origin main &&
             NEW_COMMIT=$(git rev-parse HEAD) &&
             if git diff --quiet "$OLD_COMMIT" "$NEW_COMMIT" -- package-lock.json; then
               echo "Dependencies unchanged. Skipping npm ci."
             else
               echo "Dependencies changed. Installing packages..."
               npm ci &&
               npx prisma generate ||
               exit 1
             fi &&
             pm2 restart a6news-backend --update-env &&
             pm2 save'
